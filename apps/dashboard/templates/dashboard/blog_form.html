{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write Blog Post | V Restaurant</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-slate-950 text-light overflow-x-hidden">

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-dark bg-slate-900 border-bottom border-white-10 py-3 sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center" href="{% url 'dashboard:blog_list' %}">
                <i class="bi bi-chevron-left me-2 text-primary fs-5"></i>
                <span class="fs-4 fw-bold text-uppercase tracking-widest text-gradient">V Restaurant</span>
                <span class="badge bg-primary ms-2" style="font-size: 0.65rem;">WRITE BLOG POST</span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10 col-sm-12">
                <div class="glass-panel p-4 rounded-4 border border-white-10">
                    <h3 class="font-playfair text-white fw-bold mb-4">Write Blog Post</h3>
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {% for field in form %}
                        <div class="mb-3">
                            <label for="{{ field.id_for_label }}" class="form-label text-secondary small mb-1">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                            <div class="invalid-feedback d-block">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                        {% endfor %}
                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a href="{% url 'dashboard:blog_list' %}" class="btn btn-secondary rounded-pill px-4">Cancel</a>
                            <button type="submit" class="btn btn-primary rounded-pill px-4">Save Post</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
