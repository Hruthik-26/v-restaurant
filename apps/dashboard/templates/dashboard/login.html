{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | V Restaurant</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Premium Style overrides -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #F8FAFC 0%, #EFF6FF 50%, #F8FAFC 100%);
        }
        .login-card {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
            box-shadow: 0 20px 60px rgba(0,0,0,0.10);
            border-radius: 24px;
            max-width: 450px;
            width: 100%;
            padding: 2.5rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, #C6A15B, #D4B87A, #C6A15B);
        }
        .brand-logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #1F2937;
            margin-bottom: 0.5rem;
        }
        .brand-logo span { color: #C6A15B; }
        .form-control {
            background-color: #F8FAFC !important;
            border: 1px solid #E5E7EB !important;
            color: #1F2937 !important;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            background-color: #FFFFFF !important;
            border-color: #C6A15B !important;
            box-shadow: 0 0 0 3px rgba(198, 161, 91, 0.15) !important;
        }
        .form-label { color: #6B7280; font-size: 0.875rem; font-weight: 500; }
        .btn-login {
            background: linear-gradient(135deg, #C6A15B 0%, #A8833A 100%);
            border: none;
            color: white;
            padding: 0.8rem;
            border-radius: 12px;
            font-weight: 600;
            letter-spacing: 0.05em;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(198, 161, 91, 0.4);
            filter: brightness(1.05);
            color: white;
        }
        .btn-login:active { transform: translateY(0); }
    </style>
</head>
<body style="background: linear-gradient(135deg, #F8FAFC 0%, #EFF6FF 50%, #F8FAFC 100%);">

    <div class="login-card">
        <div class="brand-logo">L'<span>É</span>toile Bistro</div>
        <p class="mb-4" style="color:#6B7280; font-size:0.8rem; letter-spacing:2px; text-transform:uppercase;">Administrator Portal</p>

        {% if form.errors or form.non_field_errors %}
        <div class="alert alert-danger-dim border border-danger text-danger text-start small rounded-3 p-3 mb-4 animate-pulse">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> Invalid username or password. Please try again.
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3 text-start">
                <label for="id_username" class="form-label text-secondary small">Username</label>
                <input type="text" name="username" autofocus required id="id_username" 
                       class="form-control" placeholder="Enter admin username">
            </div>
            
            <div class="mb-4 text-start">
                <label for="id_password" class="form-label text-secondary small">Password</label>
                <input type="password" name="password" required id="id_password" 
                       class="form-control" placeholder="Enter password">
            </div>

            <button type="submit" class="btn btn-login w-100 mb-3">
                SIGN IN <i class="bi bi-box-arrow-in-right ms-1"></i>
            </button>
            
            <a href="{% url 'core:home' %}" class="text-decoration-none small" style="color:#9CA3AF;">
                <i class="bi bi-arrow-left me-1"></i> Back to Main Site
            </a>
        </form>
    </div>

</body>
</html>
