{% extends 'core/base.html' %}
{% load static %}

{% block content %}
<section class="error-section min-vh-100 d-flex align-items-center position-relative py-5">
    <div class="container py-5 d-flex justify-content-center text-center">
        <div class="glass-panel p-5 rounded-5 border border-white-10 text-light" style="max-width: 600px; background: rgba(15, 23, 42, 0.7);" data-aos="zoom-in">
            <h1 class="display-1 fw-bold text-gradient font-playfair mb-3">404</h1>
            <h2 class="h3 text-white mb-4">Gourmet Destination Not Found</h2>
            <p class="text-secondary mb-5">The culinary creation page you are looking for has either been removed from the menu, renamed, or is temporarily offline.</p>
            <div class="d-flex justify-content-center gap-3">
                <a href="{% url 'core:home' %}" class="btn btn-primary px-4 py-3 rounded-pill fw-bold hover-scale shadow-glow tracking-wider text-uppercase">Go back Home</a>
                <a href="{% url 'core:menu' %}" class="btn btn-outline-light px-4 py-3 rounded-pill fw-bold hover-scale glass-btn-outline tracking-wider text-uppercase">Browse Menu</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
